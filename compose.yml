services:
  postgres:
    image: postgres:18.6
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-ParsingHTML}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - /var/lib/postgresql/data/pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-ParsingHTML}"]
      interval: 7s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:9.18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-postgres_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgadmin4/pgpass
    volumes:
      - /var/lib/pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgadmin4/pgpass:ro
    ports:
      - 5050:80
    networks:
      - app
    restart: unless-stopped

  app: 
    container_name: ParsingHTML
    image: parsinghtml:latest
    build: 
      context: .
      dockerfile: dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports: 
      - 8090:80
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:-Server=postgres;Database=ParsingHTML;Port=5432;Password=admin;User Id=admin;SSLMode=Prefer}
      ASPNETCORE_URLS: http://+:80
    networks:
      - app
    
volumes:
  pgdata:
    driver: local

networks:
  app:
    driver: bridge
